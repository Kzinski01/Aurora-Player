name: Verificar projeto

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/renderer/package-lock.json
      - run: npm ci
      - run: npm --prefix src/renderer ci
      - run: npm run prepare:binaries
      - run: npm run test:unit
      - run: npm run build:renderer
      - run: npm audit --audit-level=moderate
      - run: npm --prefix src/renderer audit --audit-level=moderate
